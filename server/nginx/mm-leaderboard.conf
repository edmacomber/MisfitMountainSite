# Misfit Monsters API — mountainstudio.cloud
#
# Two rate-limit zones: submit-class (stricter) and read-class (bursty
# to tolerate normal level-complete flurries + a leaderboard view
# refresh). Event endpoints (telemetry + errors) are fire-and-forget
# from the client, so they get their own low-cost zone.

limit_req_zone $binary_remote_addr zone=mm_submit:10m rate=1r/s;
limit_req_zone $binary_remote_addr zone=mm_read:10m   rate=5r/s;
limit_req_zone $binary_remote_addr zone=mm_event:10m  rate=3r/s;

server {
    server_name mountainstudio.cloud www.mountainstudio.cloud;

    # Static root — bare-domain landing page
    root /opt/MisfitMountainSite/server/public;
    index index.html;

    # Let's Encrypt ACME challenges
    location /.well-known/acme-challenge/ {
        root /var/www/mm-leaderboard/public;
    }

    # Leaderboard — reads
    location /api/leaderboard/ {
        limit_req zone=mm_read burst=20 nodelay;
        proxy_pass http://127.0.0.1:8001/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 20s;
        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
    }

    # Leaderboard — strict rate limit on submit
    location = /api/leaderboard/submit {
        limit_req zone=mm_submit burst=5 nodelay;
        proxy_pass http://127.0.0.1:8001/submit;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Telemetry — level events + error events. Rate-limited but not as
    # strictly as leaderboard submits; bursts are normal (multi-event
    # in quick succession on level end).
    location /api/events/ {
        limit_req zone=mm_event burst=10 nodelay;
        proxy_pass http://127.0.0.1:8001/events/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Profile — POST /profile/location fires when a player saves a new
    # location in Settings (v1.4.1-profile-location). Backs a geocode
    # background task; one call per save is the normal cadence, so
    # mm_submit's strict zone with a small burst is appropriate.
    # Mounted at a top-level path (not nested under /api/leaderboard/)
    # so clients can semantically separate "profile writes" from
    # leaderboard score submissions.
    location /api/profile/ {
        limit_req zone=mm_submit burst=3 nodelay;
        proxy_pass http://127.0.0.1:8001/profile/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 429 = @ratelimited;
    location @ratelimited {
        default_type application/json;
        return 429 '{"error":"rate_limited","detail":"slow down a bit"}';
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/mountainstudio.cloud/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/mountainstudio.cloud/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}


server {
    if ($host = www.mountainstudio.cloud) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = mountainstudio.cloud) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name mountainstudio.cloud www.mountainstudio.cloud;
    return 404; # managed by Certbot




}